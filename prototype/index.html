  /* conflict (simulated): someone else saved after we loaded */
  function showConflict() {
    const other = owner.id !== u.id ? owner : (userById(sharesOf(doc.id).find((s) => s.role === 'editor')?.userId) || userById('u_priya'));
    const b = h(`<div class="banner banner--conflict" role="alert"><span class="ico">${icon('users')}</span>
      <div class="txt"><b>${esc(firstName(other))} saved a newer version 10s ago.</b> <span>Your edits are safe here — pick which version to keep.</span></div>
      <div class="acts"><button class="btn btn--sm" data-hers>Load ${other.id === 'u_leo' ? 'his' : 'hers'}</button><button class="btn btn--primary btn--sm" data-mine>Keep mine</button></div></div>`);
    banners.prepend(b);
    const close = () => { b.classList.add('is-leaving'); setTimeout(() => b.remove(), 300); };
    b.querySelector('[data-mine]').onclick = () => {
      close(); saver.set('saving');
      setTimeout(() => { commit(); saver.lastSaved = Date.now(); saver.set('saved'); toast({ type: 'success', title: 'Kept your version', body: `${firstName(other)} will see your changes highlighted next time.` }); }, 350);
    };
    b.querySelector('[data-hers]').onclick = () => {
      close();
      const theirs = JSON.parse(JSON.stringify(doc.content));
      theirs.content = [...(theirs.content || []), { type: 'paragraph', content: [{ type: 'text', text: `${firstName(other)}: ` , marks: [{ type: 'bold' }] }, { type: 'text', text: 'moved the launch to Tuesday so support can staff up.' }] }];
      editor.commands.setContent(theirs, false);
      commit(other.id); markSeen(u.id, doc);
      saver.lastSaved = Date.now(); saver.set('saved');
      toast({ type: 'info', title: `Loaded ${firstName(other)}'s version`, body: 'Your unsaved edits were discarded.' });
    };
  }

  /* fidelity report for a fresh import */
  if (report) {
    const list = (arr) => arr.map(([k, n]) => plural(n, k)).join(', ');
    const b = h(`<div class="banner banner--fid" role="status"><span class="ico">${icon('fileUp')}</span>
      <div class="txt"><b>Imported from ${esc(report.file)}</b> <span>— ${report.kept.length ? `<span class="kept">kept ${list(report.kept)}</span>` : `kept ${plural(report.words, 'word')} of text`}${report.changed.length ? `; flattened ${list(report.changed)} to plain text` : ''}${report.dropped.length ? `; <span class="dropped">dropped ${list(report.dropped)}</span>` : '; nothing dropped'}.</span></div>
      <div class="acts"><button class="btn btn--sm" data-undo>${icon('undo', 'i--sm')} Undo import</button><button class="icon-btn" data-x aria-label="Dismiss" style="width:30px;height:30px">${icon('x', 'i--sm')}</button></div></div>`);
    banners.append(b);
    b.querySelector('[data-x]').onclick = () => { b.classList.add('is-leaving'); setTimeout(() => b.remove(), 300); };
    b.querySelector('[data-undo]').onclick = () => {
      view.saver = null;
      db.docs = db.docs.filter((x) => x.id !== doc.id); persist();
      toast({ type: 'info', title: 'Import undone', body: `${report.file} was not added.` });
      go('#/');
    };
  }

  /* viewer banner */
  if (role === 'viewer') {
    banners.append(h(`<div class="banner banner--viewer" role="note"><span class="ico">${icon('eye')}</span><div class="txt"><b>You're viewing this document.</b> <span>${esc(firstName(owner))} gave you view-only access — the toolbar is turned off. Ask ${esc(firstName(owner))} if you need to edit.</span></div></div>`));
  }

  /* catch-up: highlights + avatars on by default, Prev / Next, then "all caught up" */
  let cuIdx = 0, cuBanner = null;
  const cuDecos = (current) => {
    const found = catchupKey.getState(editor.state).find();
    return found.map((dd, k) => Decoration.node(dd.from, dd.to, cuAttrs(dd.spec.author, k === current), { author: dd.spec.author }));
  };
  const cuAttrs = (a, cur) => ({ class: 'cu-block' + (cur ? ' is-current' : ''), 'data-cu-by': initials(a.name), style: `--cu-color:${a.color}`, title: `Changed by ${a.name}` });
  function paintCatchup() {
    const decos = [];
    editor.state.doc.forEach((node, offset, index) => {
      if (cu.changed.includes(index)) { const a = cu.authorOf(index); decos.push(Decoration.node(offset, offset + node.nodeSize, cuAttrs(a, decos.length === 0), { author: a })); }
    });
    editor.view.dispatch(editor.state.tr.setMeta(catchupKey, DecorationSet.create(editor.state.doc, decos)).setMeta('addToHistory', false));
  }
  function showCatchup() {
    const total = cu.changed.length;
    const b = cuBanner = h(`<div class="banner banner--catchup" role="status">
      <span class="ico">${icon('sparkle')}</span>
      <div class="txt"><b>${esc(namesOf(cu.editors))} changed ${plural(total, 'section')} since you last looked</b>${cu.removed ? ` <span>· removed ${cu.removed}</span>` : ''} <span>· ${ago(cu.when)}</span></div>
      <div class="acts">${total ? `<button class="btn btn--ghost btn--sm" data-prev aria-label="Previous change">${icon('up', 'i--sm')}</button><span class="counter" data-ctr style="align-self:center;min-width:44px;text-align:center"></span><button class="btn btn--primary btn--sm" data-next>Next ${icon('down', 'i--sm')}</button>` : ''}<button class="btn btn--ghost btn--sm" data-done>Mark as read</button></div></div>`);
    banners.prepend(b);
    b.querySelector('[data-prev]')?.addEventListener('click', () => step(-1));
    b.querySelector('[data-next]')?.addEventListener('click', () => step(1));
    b.querySelector('[data-done]').onclick = () => caughtUp(true);
    updateCtr();
  }
  function updateCtr() {
    if (!cuBanner) return;
    const n = catchupKey.getState(editor.state).find().length;
    const ctr = cuBanner.querySelector('[data-ctr]'); if (ctr) ctr.textContent = `${Math.min(cuIdx + 1, n)} of ${n}`;
    const nx = cuBanner.querySelector('[data-next]'); if (nx) nx.innerHTML = cuIdx >= n - 1 ? `${icon('check', 'i--sm')} Done` : `Next ${icon('down', 'i--sm')}`;
    const pv = cuBanner.querySelector('[data-prev]'); if (pv) pv.disabled = cuIdx <= 0;
  }
  function step(dir) {
    const n = catchupKey.getState(editor.state).find().length;
    if (!n) return caughtUp();
    if (dir > 0 && cuIdx >= n - 1) return caughtUp();
    cuIdx = Math.max(0, Math.min(n - 1, cuIdx + dir));
    const decos = cuDecos(cuIdx);
    editor.view.dispatch(editor.state.tr.setMeta(catchupKey, DecorationSet.create(editor.state.doc, decos)).setMeta('addToHistory', false));
    editor.view.nodeDOM(decos[cuIdx].from)?.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'center' });
    updateCtr();
  }
  function caughtUp(skipped) {
    const b = cuBanner; cuBanner = null;
    if (b) { b.classList.add('is-leaving'); setTimeout(() => b.remove(), 300); }
    shell.classList.add('ed-catchup-off');
    setTimeout(() => { editor?.view.dispatch(editor.state.tr.setMeta(catchupKey, DecorationSet.empty)); shell.classList.remove('ed-catchup-off'); }, 480);
    const c = h(`<div class="caught" role="status">${teddyEl('')}<div class="grow"><h3>You're all caught up</h3><p>${skipped ? 'Marked as read.' : `You've seen all ${plural(cu.changed.length, 'change')} from ${esc(namesOf(cu.editors))}.`} Highlights are cleared — we'll flag anything new next time.</p></div><button class="btn btn--sm" data-x>Back to writing</button></div>`);
    setTimeout(() => {
      banners.prepend(c);
      teddy = mountTeddy(c.querySelector('.teddy'));
      setTimeout(() => teddy.success(), 500);
      scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' });
    }, 300);
    const close = () => { c.classList.add('is-leaving'); setTimeout(() => { c.remove(); teddy?.destroy(); teddy = null; }, 320); };
    c.querySelector('[data-x]').onclick = () => { close(); editor?.commands.focus(); };
    const t = setTimeout(close, 9000); view.cleanup.push(() => clearTimeout(t));
  }

  /* handoff note */
  function showNote(force) {
    if (!share?.note || side.querySelector('.note-callout')) return;
    if (share.noteSeenAt && !force) return;
    const n = h(`<div class="note-callout" role="note"><div class="from">${avatar(owner, 'xs')} Note from ${esc(firstName(owner))}</div><p class="body">${esc(share.note)}</p><div class="row"><span class="when">Shared ${ago(share.createdAt)}</span><button class="btn btn--sm">${icon('check', 'i--sm')} Got it</button></div></div>`);
    n.querySelector('button').onclick = () => {
      share.noteSeenAt = share.noteSeenAt || Date.now(); persist();
      n.classList.add('is-leaving'); setTimeout(() => n.remove(), 520);
    };
    side.append(n);
  }

  /* editor */
  let editor = null;
  const setTimer = setTimeout(() => {
    shell.querySelector('[data-skel]').remove();
    shell.querySelector('[data-page]').hidden = false;
    editor = view.editor = new Editor({
      element: shell.querySelector('[data-pm]'),
      extensions: [...SCHEMA_EXT, Placeholder.configure({ placeholder: canEdit ? 'Tip: type # for a heading, - for a list, **bold** for bold…' : '' }), CatchUp],
      content: doc.content,
      editable: canEdit,
      editorProps: { attributes: { 'aria-label': 'Document body', spellcheck: 'true' } },
      onUpdate: () => { saver.schedule(); updateStats(); },
      onTransaction: () => updateToolbar(),
      onBlur: () => { if (saver.state === 'saving') saver.flush(); },
    });
    updateToolbar(); updateStats();
    if (cu) { paintCatchup(); showCatchup(); }
    showNote();
    if (doc.isNew && canEdit) { titleEl.focus(); titleEl.select(); }
  }, reduceMotion() ? 0 : 220);
  view.cleanup.push(() => clearTimeout(setTimer));

  /* toolbar */
  const tb = shell.querySelector('.ed-toolbar');
  const CMDS = {
    undo: (c) => c.undo(), redo: (c) => c.redo(),
    p: (c) => c.setParagraph(), h1: (c) => c.toggleHeading({ level: 1 }), h2: (c) => c.toggleHeading({ level: 2 }), h3: (c) => c.toggleHeading({ level: 3 }),
    bold: (c) => c.toggleBold(), italic: (c) => c.toggleItalic(), underline: (c) => c.toggleUnderline(),
    bullet: (c) => c.toggleBulletList(), ordered: (c) => c.toggleOrderedList(),
  };
  tb.addEventListener('mousedown', (e) => { if (e.target.closest('[data-cmd]')) e.preventDefault(); });
  tb.addEventListener('click', (e) => {
    const b = e.target.closest('[data-cmd]'); if (!b || !editor || !canEdit) return;
    CMDS[b.dataset.cmd](editor.chain().focus()).run();
  });
  if (!canEdit) tb.querySelectorAll('[data-cmd]').forEach((b) => { b.disabled = true; });
  function updateToolbar() {
    if (!editor) return;
    const act = {
      p: editor.isActive('paragraph') && !editor.isActive('bulletList') && !editor.isActive('orderedList'),
      h1: editor.isActive('heading', { level: 1 }), h2: editor.isActive('heading', { level: 2 }), h3: editor.isActive('heading', { level: 3 }),
      bold: editor.isActive('bold'), italic: editor.isActive('italic'), underline: editor.isActive('underline'),
      bullet: editor.isActive('bulletList'), ordered: editor.isActive('orderedList'),
    };
    tb.querySelectorAll('[data-cmd]').forEach((b) => {
      const k = b.dataset.cmd;
      if (k in act) { b.classList.toggle('is-active', canEdit && act[k]); b.setAttribute('aria-pressed', String(act[k])); }
      if (canEdit && (k === 'undo' || k === 'redo')) b.disabled = !editor.can()[k]();
    });
  }
  function updateStats() {
    if (!editor) return;
    const words = wordCount(editor.getText());
    statEl.textContent = words ? `${words.toLocaleString()} word${words === 1 ? '' : 's'} · ${Math.max(1, Math.round(words / 230))} min read` : 'Empty page';
  }

  /* title rename */
  titleEl.addEventListener('input', () => saver.schedule());
  titleEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); editor?.commands.focus('end'); } if (e.key === 'Escape') { titleEl.value = doc.title; titleEl.blur(); } });
  titleEl.addEventListener('blur', () => { if (!titleEl.value.trim()) titleEl.value = 'Untitled document'; if (canEdit && titleEl.value !== doc.title) saver.flush(); });

  /* share / more */
  shell.querySelector('[data-share]').addEventListener('click', () => openShare(doc, () => renderCollab()));
  shell.querySelector('[data-more]').onclick = (e) => {
    const b = e.currentTarget; if (openPop?.anchor === b) return closePop();
    const el = h(`<div>
      <div class="pop-sec">
        <button class="pop-item" data-f>${icon('focus', 'i--sm')}<span class="grow">Focus mode</span><span class="kbd">⌘.</span></button>
        ${share?.note ? `<button class="pop-item" data-n>${icon('note', 'i--sm')}<span class="grow">Show handoff note</span></button>` : ''}
        <button class="pop-item" data-copy>${icon('link', 'i--sm')}<span class="grow">Copy link</span></button>
      </div>
      ${role === 'owner' ? `<div class="pop-sec"><button class="pop-item pop-item--danger" data-del>${icon('trash', 'i--sm')}<span class="grow">Delete document</span></button></div>` : `<div class="pop-sec"><div class="pop-label" style="text-transform:none;letter-spacing:0;font-weight:500">Only ${esc(owner.name)} can share or delete.</div></div>`}
    </div>`);
    el.querySelector('[data-f]').onclick = () => { closePop(); enterFocus(); };
    el.querySelector('[data-n]')?.addEventListener('click', () => { closePop(); showNote(true); });
    el.querySelector('[data-copy]').onclick = async () => { closePop(); try { await navigator.clipboard.writeText(location.href); toast({ type: 'success', title: 'Link copied', body: 'Only people with access can open it.' }); } catch { toast({ type: 'info', title: 'Copy the URL from the address bar', body: 'Clipboard access was blocked.' }); } };
    el.querySelector('[data-del]')?.addEventListener('click', async () => { closePop(); if (await deleteDoc(doc)) { view.saver = null; go('#/'); } });
    popover(b, el);
  };

  /* focus mode */
  function enterFocus() { document.body.classList.add('focus-mode'); editor?.commands.focus(); }
  function exitFocus() { document.body.classList.remove('focus-mode'); }
  view.exitFocus = exitFocus;
  shell.querySelector('[data-focus]').onclick = () => document.body.classList.contains('focus-mode') ? exitFocus() : enterFocus();
  shell.querySelector('[data-exit-focus]').onclick = exitFocus;
  const onKey = (e) => { if ((e.metaKey || e.ctrlKey) && e.key === '.') { e.preventDefault(); document.body.classList.contains('focus-mode') ? exitFocus() : enterFocus(); } if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (canEdit) saver.flush(); } };
  document.addEventListener('keydown', onKey);

  const flushNow = () => { if (canEdit && !['saved', 'conflict'].includes(saver.state) && view.saver === saver) commit(); };
  addEventListener('beforeunload', flushNow);
  view.cleanup.push(() => {
    document.removeEventListener('keydown', onKey); removeEventListener('beforeunload', flushNow);
    clearTimeout(saver.timer); clearTimeout(saver.retryT);
    if (view.saver === saver && canEdit && !['saved', 'conflict'].includes(saver.state) && docById(doc.id)) {
      commit();
      if (!isOnline()) toast({ type: 'info', title: 'Changes kept on this device', body: "They'll sync when you're back online." });
    }
    if (docById(doc.id)) markSeen(u.id, doc);
    editor?.destroy(); view.saver = null;
  });
}

/* ---------------------------------------------------------------------
   Boot
   --------------------------------------------------------------------- */
/* Deep links into any state, for reviewers and screenshots: index.html?shot=<name>[&as=u_leo][&theme=dark]
   Each shot starts from fresh seed data (in memory only — it does not touch your saved prototype data). */
const qs = new URLSearchParams(location.search);
const shot = qs.get('shot');
if (shot) {
  window.__noVT = true;
  document.documentElement.classList.add('no-anim');
  const keep = persist; persist = () => {};
  db = seed(); db.theme = qs.get('theme') || 'light'; applyTheme();
  db.session = shot === 'signin' ? null : (qs.get('as') || 'u_aarav');
  firstDashLoad = false;
  const wait = (ms) => sleep(ms);
  const click = (sel) => document.querySelector(sel)?.click();
  const routes = { signin: '#/signin', dash: '#/', 'dash-new': '#/', empty: '#/', doc: '#/d/d_roadmap', 'doc-next': '#/d/d_roadmap', caught: '#/d/d_roadmap', share: '#/d/d_roadmap', 'share-error': '#/d/d_roadmap', 'share-editor': '#/d/d_roadmap', viewer: '#/d/d_interview', note: '#/d/d_onboarding', conflict: '#/d/d_weekly', offline: '#/d/d_weekly', notfound: '#/d/d_hiring', 'new-doc': '#/', import: '#/', 'import-dialog': '#/', menu: '#/' };
  if (shot === 'empty') { db.session = 'u_leo'; db.docs = db.docs.filter((d) => d.ownerId !== 'u_leo'); db.shares = db.shares.filter((s) => s.userId !== 'u_leo'); }
  if (shot === 'share-editor') db.session = 'u_priya';
  if (shot === 'offline') db.demo.offline = true;
  if (shot === 'conflict') db.demo.conflict = true;
  history.replaceState(null, '', location.pathname + location.search + (routes[shot] || '#/'));
  route();
  (async () => {
    await wait(700);
    if (shot === 'dash-new') click('[data-f="new"]');
    if (shot === 'doc-next') click('[data-next]');
    if (shot === 'caught') { for (let i = 0; i < 3; i++) { click('[data-next]'); await wait(150); } }
    if (shot === 'share' || shot === 'share-error' || shot === 'share-editor') click('[data-share]');
    if (shot === 'share-error') { await wait(300); const e = document.querySelector('#sh-email'); e.value = 'priya@ajaia.dev'; click('.share-add button[type=submit]'); }
    if (shot === 'conflict' || shot === 'offline') { view.editor?.commands.insertContentAt(view.editor.state.doc.content.size, '<p>Adding a line for the Friday demo.</p>'); view.saver?.flush(); }
    if (shot === 'new-doc') newDoc();
    if (shot === 'import-dialog') openImport();
    if (shot === 'menu') { const hn = document.querySelector('.head-new'); if (hn && getComputedStyle(hn).display !== 'none') hn.click(); else click('.user-btn'); }
    if (shot === 'import') {
      const md = '# Meeting notes\n\nWe agreed on **three** things:\n\n- Ship the *import* flow\n- Keep the 2 MB limit\n- Review on Friday\n\n## Risks\n\n| Risk | Owner |\n|---|---|\n| Tables | Leo |\n\n![chart](chart.png)\n';
      openImport({ name: 'meeting-notes.md', size: md.length, text: async () => md });
    }
  })();
  window.__shotPersist = keep;
} else {
  route();
}
window.__ajaia ={ get db() { return db; }, reset() { db = seed(); persist(); location.hash = '#/signin'; location.reload(); } };
</script>
