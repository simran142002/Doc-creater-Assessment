<!doctype html><meta charset="utf-8"><title>harness</title>
<style>html,body{margin:0;background:#fff;height:100%}body{display:grid;place-items:center}iframe{border:0;display:block}pre{position:absolute;left:0;top:0;margin:0;font-size:1px;color:#fff}</style>
<iframe id="f"></iframe>
<pre id="r"></pre>
<script>
const q=new URLSearchParams(location.search), w=+q.get('w'), h=+q.get('h');
const f=document.getElementById('f'); f.width=w; f.height=h; f.src='../index.html?shot='+q.get('shot')+(q.get('as')?'&as='+q.get('as'):'');
setTimeout(()=>{const d=f.contentDocument.documentElement; const over=[...f.contentDocument.querySelectorAll('body *')].filter(e=>{const r=e.getBoundingClientRect();return r.width&&r.right>w+1&&getComputedStyle(e).position!=='fixed'&&!e.closest('.ed-toolbar,.seg,.prose,.thumb-page')}).slice(0,6).map(e=>e.tagName+'.'+String(e.className).slice(0,40)+':'+Math.round(e.getBoundingClientRect().right));
document.getElementById('r').textContent='SCROLLW='+d.scrollWidth+' W='+w+' OVER='+JSON.stringify(over);},3200);
</script>
